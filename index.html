<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cintya & Nawwaldi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOVE BACKGROUND -->
    <div class="hearts"></div>

    <!-- HERO -->
    <section class="hero">

        <h1>Cintya 💜 Nawwaldi</h1>

        <p>
            our beautiful love story ✨
        </p>

    </section>

    <!-- TIMER -->
    <section class="timer-section">

        <h2>Sudah Bersama Selama</h2>

        <div id="timer"></div>

    </section>

    <!-- STORY -->
    <section class="story">

        <h2>Cerita Kita 📖</h2>

        <div class="card">
            <h3>Awal Bertemu</h3>

            <p>
                Semua dimulai dari pertemuan sederhana
                yang akhirnya menjadi kisah terindah 💙
            </p>
        </div>

        <div class="card">
            <h3>Hari Jadian</h3>

            <p>
                Hari dimana aku menemukan rumah
                di dalam diri kamu 💜
            </p>
        </div>

    </section>

    <!-- GALLERY -->
    <section class="gallery">

        <h2>Galeri Kita 📸</h2>

        <div class="gallery-container">

            <img src="images/foto1.png">
            <img src="images/foto2.png">
            <img src="images/foto3.png">

        </div>

    </section>

    <!-- MUSIC -->
    <audio autoplay loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <script src="script.js"></script>

</body>

</html>
